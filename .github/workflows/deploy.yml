name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write           # lets the job push to gh-pages

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install WebAssembly build tools (needed for AOT)
        run: dotnet workload install wasm-tools

      # Tests are off to keep the deploy short; they are run during development. Remove the # to run them again.
      # - name: Test
      #   run: dotnet test TablePlanner.slnx

      - name: Check out gh-pages
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: gh-pages

      - name: Publish (AOT) into the gh-pages checkout
        shell: pwsh
        run: ./publish.ps1 -BasePath /tableplanner/ -Target gh-pages

      - name: Commit and push
        working-directory: gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Deploy ${GITHUB_SHA::7}"
          git push
